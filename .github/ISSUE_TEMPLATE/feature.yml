name: ✨ Feature
description: A new capability that does not exist yet
labels: ["enhancement", "backlog"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for this
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or impossible today. Describe the need, not the solution.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >
        What must be true for this to be done. Scoping routes features to a plan with
        acceptance criteria and a test plan — this field seeds both, so write
        conditions that can be checked, not aspirations.
      placeholder: |
        - [ ] Scout review queue accepts a status filter
        - [ ] Filtered-out rows are excluded from the count badge
        - [ ] Existing unfiltered behavior is unchanged when the param is absent
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including doing nothing, and why that is not enough.
    validations:
      required: false

  - type: dropdown
    id: routing
    attributes:
      label: Is the approach decided?
      description: >
        Routes triage. "Decided" skips research and goes straight to planning. Pick "unsure" freely — it is
        a signal, not a failure, and triage will make the call.
      options:
        - Decided — the issue says how, not just what
        - Not decided — needs research first
        - Unsure
    validations:
      required: true
