name: CD

# Handles preview deploys on PRs and production deploys on push to main.
# Vercel's own Git integration must be disabled (Ignored Build Step → exit 0)
# to avoid competing deploys.
#
# Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID; optionally
# VERCEL_AUTOMATION_BYPASS_SECRET (the health check otherwise mints its own bypass via `vercel curl`).
# Runtime config (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY) is NOT set here —
# vercel pull fetches it from the Vercel project's environment variables.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Deploy only after the full CI gate passes. `needs:` cannot reach a job in another
  # workflow file, so CI is called here as a reusable workflow (ci.yml: workflow_call).
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Dependabot-triggered runs get no repo secrets, so VERCEL_TOKEN would be empty.
    # Dependency bumps don't need a preview; CI alone gates them.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Deploy
        id: deploy
        # The CLI prints the deployment URL alone on stdout (progress goes to stderr).
        run: |
          url=$(vercel deploy ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
      # The deploy is not done until the functions answer. /api/health probes Supabase
      # Auth with the deployment's own env, so a project whose variables are missing or
      # wrong fails here (503) instead of on the first visitor's intake. Every
      # per-deployment URL, production included, sits behind Vercel Deployment
      # Protection; a plain curl gets a 302 to the login page and never reaches the
      # function (#56: prod served 500 on every route while this check saw only 302s).
      # `vercel curl` mints a bypass token with VERCEL_TOKEN, so previews and `--prod`
      # are both checked for real; VERCEL_AUTOMATION_BYPASS_SECRET is used if set.
      # Pass on a 200 whose body is `{ "ok": true, ... }` only. A cancelled or
      # superseded deployment answers 200 with an HTML page.
      - name: Check /api/health
        env:
          URL: ${{ steps.deploy.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          body=$(mktemp)
          for attempt in 1 2 3 4 5 6; do
            status=$(vercel curl /api/health --deployment "$URL" --token "$VERCEL_TOKEN" --yes \
              ${BYPASS:+--protection-bypass "$BYPASS"} \
              -- -sS -o "$body" -w '%{http_code}' || echo 000)
            echo "attempt $attempt: HTTP $status $(head -c 300 "$body")"
            if [ "$status" = "200" ] && jq -e '.ok == true' "$body" >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          echo "::error::/api/health did not answer 200 {ok:true} (last status $status) — see api/README.md › Testing › Deploy check"
          exit 1
